      <circle cx="-15" cy="-8" r="13" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="15" cy="-8" r="13" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="-10" cy="15" r="13" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="10" cy="15" r="13" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <polygon points="0,-2 -7,10 7,10" fill="#357D42" />
    </g>

    <!-- Bunga 4 -->
    <g transform="translate(275, 415)">
