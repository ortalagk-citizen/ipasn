    <path
      d="M625,590 C570,560 520,590 500,635 L500,480 C520,440 570,410 620,445 Z"
      fill="#F6B828"
      stroke="#000000"
      stroke-width="4.5"
    />
    <!-- Lapisan Lembar Kanan Dalam -->
    <path
      d="M610,575 C565,552 525,578 505,618 L505,492 C525,455 565,430 605,458 Z"
      fill="#FFD242"
      stroke="#000000"
      stroke-width="2"
    />

    <!-- Garis Ayat Kitab Suci Bergelombang (Tulisan Hitam Khas Logo Kemenag) -->
    <!-- Halaman Kiri -->
    <path d="M435,480 C445,475 455,483 468,478" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <path d="M425,502 C440,497 455,505 475,500" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
    <path d="M420,524 C438,519 452,527 478,522" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
    <path d="M415,546 C435,541 450,549 475,544" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />

    <!-- Halaman Kanan -->
    <path d="M532,478 C545,483 555,475 565,480" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />
    <path d="M525,500 C545,505 560,497 575,502" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
    <path d="M522,522 C548,527 562,519 580,524" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
    <path d="M525,544 C550,549 565,541 585,546" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- 6. PITA PUTIH MELENGKUNG DENGAN TULISAN "IKHLAS BERAMAL" -->
  <g>
    <!-- Lipatan Pita Kiri & Kanan Belakang (3D Shadow) -->
    <polygon points="175,765 295,780 265,850 185,845" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
    <polygon points="175,765 235,772 185,845" fill="#094A2D" />

    <polygon points="825,765 705,780 735,850 815,845" fill="#FFFFFF" stroke="#000000" stroke-width="6" />
    <polygon points="825,765 765,772 815,845" fill="#094A2D" />

    <!-- Badan Pita Putih Depan Melengkung Anggun -->
    <path
      d="M265,800 C390,735 610,735 735,800 C680,885 320,885 265,800 Z"
      fill="#FFFFFF"
      stroke="#000000"
      stroke-width="8"
      stroke-linejoin="round"
    />

    <!-- Jalur Teks Busur untuk Tulisan IKHLAS BERAMAL -->
    <path
      id="textRibbonPath"
      d="M285,840 C400,772 600,772 715,840"
      fill="none"
    />

    <!-- Teks Resmi Tebal IKHLAS BERAMAL Melengkung -->
    <text
      font-family="'Arial Black', 'Impact', sans-serif"
      font-size="62"
      font-weight="900"
      letter-spacing="5"
      fill="#000000"
    >
      <textPath href="#textRibbonPath" startOffset="50%" text-anchor="middle">
        IKHLAS BERAMAL
      </textPath>
    </text>
  </g>
</svg>
