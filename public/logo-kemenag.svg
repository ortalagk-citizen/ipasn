      <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="-17" cy="-9" r="14" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="17" cy="-9" r="14" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="-11" cy="16" r="14" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="11" cy="16" r="14" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
