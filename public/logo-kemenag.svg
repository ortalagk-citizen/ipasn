<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" width="100%" height="100%">
  <defs>
    <!-- Filter for crisp rendering -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- PERISAI SEGI LIMA LUAR (BORDER EMAS/KUNING TEBAL) -->
  <polygon
    points="500,20 985,385 805,1020 195,1020 15,385"
    fill="#FFD200"
    stroke="#103820"
    stroke-width="8"
    stroke-linejoin="miter"
  />

  <!-- PERISAI SEGI LIMA DALAM (WARNA HIJAU RESMI KEMENAG) -->
