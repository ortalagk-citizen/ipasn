      <circle cx="-19" cy="-10" r="16" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="19" cy="-10" r="16" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="-13" cy="19" r="16" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="13" cy="19" r="16" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <polygon points="0,-2 -9,12 9,12" fill="#357D42" />
