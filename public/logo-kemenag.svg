    <g transform="translate(240, 485)">
      <circle cx="0" cy="0" r="21" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="-18" cy="-9" r="15" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="18" cy="-9" r="15" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="-12" cy="18" r="15" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
