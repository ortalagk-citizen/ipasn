    <path d="M580,305 C635,305 670,335 670,335 C670,335 630,348 595,325 Z" />
    <path d="M610,325 C675,325 710,360 710,360 C710,360 670,375 630,350 Z" />
    <path d="M640,355 C710,355 745,395 745,395 C745,395 700,410 660,380 Z" />
    <path d="M665,390 C740,395 775,440 775,440 C775,440 725,455 680,420 Z" />
    <path d="M685,430 C760,440 792,490 792,490 C792,490 740,505 695,465 Z" />
    <path d="M700,475 C770,490 800,545 800,545 C800,545 745,555 705,510 Z" />
    <path d="M708,525 C772,545 798,605 798,605 C798,605 740,610 705,560 Z" />
    <path d="M705,575 C765,600 788,665 788,665 C788,665 730,665 695,610 Z" />
    <path d="M695,625 C750,655 770,720 770,720 C770,720 715,715 680,660 Z" />
    <path d="M675,675 C725,710 740,775 740,775 C740,775 690,760 660,705 Z" />
    <path d="M650,725 C695,760 705,820 705,820 C705,820 660,795 630,745 Z" />
    <path d="M615,765 C655,800 660,855 660,855 C660,855 620,825 595,780 Z" />

    <!-- Batang padi utama -->
    <path
      d="M545,290 Q780,430 675,800"
      fill="none"
      stroke="#CAA028"
      stroke-width="9"
      stroke-linecap="round"
    />
  </g>

  <!-- 3. TANGKAI KAPAS KIRI (8 KUNTUM BUNGA KAPAS PUTIH BERKELOPAK) -->
