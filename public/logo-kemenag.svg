      <circle cx="-12" cy="-6" r="11" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="12" cy="-6" r="11" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="-8" cy="11" r="11" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <circle cx="8" cy="11" r="11" fill="#FFFFFF" stroke="#063820" stroke-width="2" />
      <polygon points="0,-1 -5,7 5,7" fill="#357D42" />
