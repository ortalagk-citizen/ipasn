  <!-- 4. REHAL / TATAKAN AL-QUR'AN KAYU HITAM BERSILANG (X STAND) -->
  <g>
    <!-- Kaki Rehal Kiri-Bawah ke Kanan-Atas -->
    <polygon
      points="415,640 585,735 550,755 380,660"
      fill="#181818"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linejoin="round"
    />
    <!-- Kaki Rehal Kanan-Bawah ke Kiri-Atas (Bersilang) -->
    <polygon
      points="585,640 415,735 450,755 620,660"
      fill="#181818"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linejoin="round"
    />
  </g>

  <!-- 5. KITAB SUCI TERBUKA (AL-QUR'AN KUNING EMAS KEMENAG) -->
  <g>
    <!-- Alas Cover Kitab Luar Hitam & Putih -->
    <path
      d="M375,605 L500,655 L625,605 L625,622 L500,672 L375,622 Z"
      fill="#181818"
      stroke="#000000"
