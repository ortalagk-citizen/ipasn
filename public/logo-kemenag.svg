    <!-- Lembaran Kitab Terbuka Kuning Emas (Halaman Kiri & Kanan) -->
    <!-- Halaman Kiri -->
    <path
      d="M375,590 C430,560 480,590 500,635 L500,480 C480,440 430,410 380,445 Z"
      fill="#F6B828"
      stroke="#000000"
      stroke-width="4.5"
    />
    <!-- Lapisan Lembar Kiri Dalam -->
    <path
      d="M390,575 C435,552 475,578 495,618 L495,492 C475,455 435,430 395,458 Z"
      fill="#FFD242"
      stroke="#000000"
      stroke-width="2"
